<!DOCTYPE html>
<html lang="en" data-type="software">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>EiCube - 3D Speedcubing Trainer, Puzzles & Video Guides</title>
  <meta name="description"
    content="Interactive 3D Rubik's Cube trainer featuring camera-relative moves, 2x2, 4x4, Pyraminx, speedcubing solving guides, custom keybinds, and competition-style timing." />
  <meta name="page-type" content="software" />
  <meta name="site-kind" content="software" />
  <meta name="theme-color" content="#D7E6EC" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('eicube_theme_v1');
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>
  <header class="app-header">
    <div class="header-container">
      <a class="skip-link" href="#app-main">Skip to content</a>

      <!-- Brand -->
      <button type="button" id="btn-brand-home" class="brand-group brand-home-btn" aria-label="Go to EiCube Home">

        <span class="brand-tag">v1.0.5</span>

      <!-- Navigation Tabs -->

        <button class="nav-tab" data-tab-target="cube" role="tab" aria-selected="false" aria-controls="tab-cube-panel"
          id="tab-cube-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>

            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>

        <div class="header-actions desktop-only-actions header-utility-capsule">

              <span class="nav-question-mark" aria-hidden="true">?</span>
            </button>

              <button type="button" id="btn-open-tips" class="help-dropdown-item" role="menuitem">
                <span class="nav-question-mark nav-question-mark-sm" aria-hidden="true">?</span>
                <span>Solving Tips & Diagnostic</span>
              </button>
              <button type="button" id="btn-open-help" class="help-dropdown-item" role="menuitem">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span>Interactive App Tour</span>

            </div>
          </div>

          <button id="btn-open-settings" class="btn-nav-icon btn-nav-compact"
            title="Settings: Keybinds, Color Schemes & Dark Mode" aria-label="Open Settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path

              </path>
            </svg>
          </button>
        </div>

        <a href="https://github.com/eitophetamine9/EiCube" target="_blank" rel="noopener noreferrer"
          class="btn-star-repo" id="btn-star-repo" title="Star EiCube on GitHub" aria-label="Star EiCube on GitHub">
          <svg class="star-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2">
            </polygon>
          </svg>
          <span class="star-text">Star Repo</span>
        </a>

        <!-- Mobile Burger Menu Toggle Button -->
        <button id="btn-mobile-menu-toggle" class="btn-burger-menu" aria-label="Open Navigation Menu"
          aria-expanded="false" aria-controls="mobile-nav-drawer" title="Open Navigation Menu">
          <span class="burger-lines" aria-hidden="true">
            <span class="line line-1"></span>
            <span class="line line-2"></span>
            <span class="line line-3"></span>
          </span>
        </button>
      </div>
    </div>

          <line x1="6" y1="6" x2="18" y2="18"></line>

        <nav class="mobile-nav-list" aria-label="Puzzle Views">
          <button class="mobile-nav-link is-active" data-tab-target="home">
            <span class="link-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>

              </svg>
            </span>

                <line x1="15" y1="3" x2="15" y2="21"></line>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="3" y1="15" x2="21" y2="15"></line>
              </svg>
            </span>
            <span class="link-label">3D Puzzle Trainer</span>

              </svg>
            </span>
            <span class="link-label">Learn Puzzles & Video Guides</span>
          </button>
        </nav>
      </div>

        <div class="mobile-drawer-heading">Tools & Settings</div>

                <circle cx="12" cy="12" r="3"></circle>

              </svg>
            </span>
            <span class="link-label">Studio Settings & Keybinds</span>
          </button>

          <button class="mobile-nav-link" id="btn-mobile-tips">
            <span class="link-icon tips-icon" aria-hidden="true">?</span>
            <span class="link-label">Solving Tips & Quick Help</span>
          </button>

          <button class="mobile-nav-link" id="btn-mobile-tutorial">
            <span class="link-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

                <circle cx="12" cy="12" r="10"></circle>

  <main id="app-main" class="app-main">
    <!-- Panel 0: No-login Editorial Landing Page -->
    <section id="tab-home-panel" class="tab-panel is-active" role="tabpanel" aria-labelledby="tab-home-btn">
      <div id="landing-mount" class="landing-mount">
        <!-- Editorial Landing Page mounts here -->
      </div>
    </section>

    <!-- Panel 1: Interactive 3D Cube (3x3 / 2x2 / 4x4 / Pyraminx) -->
    <section id="tab-cube-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-cube-btn" aria-hidden="true">
      <div class="studio-stage-glow" aria-hidden="true"></div>
      <div id="cube-viewport-container" class="cube-viewport-container">
        <!-- Three.js canvas mounts here -->
      </div>
      <div id="controls-mount" class="controls-mount">
        <!-- Left keybinds, right vertical history, and top controls overlay mount here -->
      </div>
    </section>

    <!-- Panel 2: Learning Guide & Visual Move GIFs -->
    <section id="tab-learn-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-learn-btn" aria-hidden="true">
      <div id="guide-mount" class="guide-mount">
        <!-- Learning Guide mounts here -->
      </div>
    </section>
  </main>

  <script type="module" src="./src/main.ts"></script>

</html>
