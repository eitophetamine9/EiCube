<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>EiCube - 3D Rubik's Cube Trainer, Other Cubes & Guide</title>
    <meta name="description" content="Interactive 3D Rubik's Cube trainer featuring camera-relative moves, 2x2, 4x4, Pyraminx, beginner solving guides, customizable keybinds, and smooth animation." />
    <meta name="theme-color" content="#090b10" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-container">
        <!-- Brand -->
        <div class="brand-group">
          <svg class="brand-logo" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span class="brand-name">EiCube</span>
          <span class="brand-tag">3D Trainer</span>
        </div>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs" role="tablist" aria-label="Main Navigation">
          <button class="nav-tab is-active" data-tab-target="cube" role="tab" aria-selected="true" aria-controls="tab-cube-panel" id="tab-cube-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
              <line x1="15" y1="3" x2="15" y2="21"></line>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="3" y1="15" x2="21" y2="15"></line>
            </svg>
            Puzzle
          </button>
          <button class="nav-tab" data-tab-target="other" role="tab" aria-selected="false" aria-controls="tab-other-panel" id="tab-other-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12 2 2 22 22 22"></polygon>
            </svg>
            Other Puzzles
          </button>
          <button class="nav-tab" data-tab-target="learn" role="tab" aria-selected="false" aria-controls="tab-learn-panel" id="tab-learn-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
            Learn Puzzles
          </button>
        </nav>

        <!-- Right group: Star button, desktop utilities, and mobile burger toggle -->
        <div class="header-right-group">
          <!-- Star Repo Button (Up Top) -->
          <a href="https://github.com/eitophetamine9/EiCube" target="_blank" rel="noopener noreferrer" class="btn btn-star-repo" id="btn-star-repo" title="Star EiCube on GitHub" aria-label="Star EiCube on GitHub">
            <svg class="star-icon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span class="star-text">Star</span>
          </a>

          <!-- Desktop utility actions -->
          <div class="header-actions desktop-only-actions">
            <!-- Question Mark Tip Button -->
            <button id="btn-open-tips" class="btn btn-nav-icon btn-tip-badge" title="Stuck? Quick Solving Tips & Help" aria-label="Open Solving Tips">
              <span class="nav-question-mark">?</span>
              <span class="btn-text-desktop">Tips</span>
            </button>

            <button id="btn-open-help" class="btn btn-nav-icon" title="Tutorial & Help" aria-label="Open Tutorial">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
              </svg>
              <span class="btn-text-desktop">Help</span>
            </button>

            <button id="btn-open-settings" class="btn btn-nav-icon" title="Customize Keybinds" aria-label="Open Keybind Settings">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
              <span class="btn-text-desktop">Keybinds</span>
            </button>

            <a href="https://github.com/eitophetamine9/EiCube" target="_blank" rel="noopener noreferrer" class="btn btn-nav-icon" title="View Source on GitHub" aria-label="GitHub Repository">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"></path>
              </svg>
            </a>
          </div>

          <!-- Mobile Burger Menu Toggle Button -->
          <button id="btn-mobile-menu-toggle" class="btn btn-nav-icon btn-burger-menu" aria-label="Open Navigation Menu" aria-expanded="false" aria-controls="mobile-nav-drawer" title="Open Navigation Menu">
            <span class="burger-lines">
              <span class="line line-1"></span>
              <span class="line line-2"></span>
              <span class="line line-3"></span>
            </span>
          </button>
        </div>
      </div>
    </header>

    <!-- Mobile Navigation Drawer & Backdrop -->
    <div id="mobile-nav-backdrop" class="mobile-nav-backdrop" aria-hidden="true"></div>
    <aside id="mobile-nav-drawer" class="mobile-nav-drawer" aria-hidden="true" role="dialog" aria-label="Mobile Navigation Menu">
      <div class="mobile-drawer-header">
        <div class="drawer-brand">
          <svg class="brand-logo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span class="drawer-brand-text">EiCube Menu</span>
        </div>
        <button id="btn-close-mobile-nav" class="btn-close-drawer" aria-label="Close Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="mobile-drawer-body">
        <div class="mobile-drawer-section">
          <div class="mobile-drawer-heading">Puzzles</div>
          <nav class="mobile-nav-list">
            <button class="mobile-nav-link is-active" data-tab-target="cube">
              <span class="link-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="9" y1="3" x2="9" y2="21"></line>
                  <line x1="15" y1="3" x2="15" y2="21"></line>
                  <line x1="3" y1="9" x2="21" y2="9"></line>
                  <line x1="3" y1="15" x2="21" y2="15"></line>
                </svg>
              </span>
              <span class="link-label">3D Puzzle Trainer (3x3)</span>
            </button>

            <button class="mobile-nav-link" data-tab-target="other">
              <span class="link-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="12 2 2 22 22 22"></polygon>
                </svg>
              </span>
              <span class="link-label">Other Puzzles (2x2, 4x4, Pyraminx)</span>
            </button>

            <button class="mobile-nav-link" data-tab-target="learn">
              <span class="link-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
              </span>
              <span class="link-label">Learn Puzzles & Video Guides</span>
            </button>
          </nav>
        </div>

        <div class="mobile-drawer-section">
          <div class="mobile-drawer-heading">Tools & Settings</div>
          <nav class="mobile-nav-list">
            <button class="mobile-nav-link" id="btn-mobile-tips">
              <span class="link-icon tips-icon">?</span>
              <span class="link-label">Solving Tips & Quick Help</span>
            </button>

            <button class="mobile-nav-link" id="btn-mobile-tutorial">
              <span class="link-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
              </span>
              <span class="link-label">App Tour & Tutorial</span>
            </button>

            <button class="mobile-nav-link" id="btn-mobile-settings">
              <span class="link-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </span>
              <span class="link-label">Custom Keybinds & Settings</span>
            </button>
          </nav>
        </div>

        <div class="mobile-drawer-footer">
          <a href="https://github.com/eitophetamine9/EiCube" target="_blank" rel="noopener noreferrer" class="mobile-star-cta">
            <svg class="star-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span>Star EiCube on GitHub</span>
          </a>
        </div>
      </div>
    </aside>
      </div>
    </header>

    <main class="app-main">
      <!-- Panel 1: Interactive 3D Cube (3x3) -->
      <section id="tab-cube-panel" class="tab-panel is-active" role="tabpanel" aria-labelledby="tab-cube-btn">
        <div id="cube-viewport-container" class="cube-viewport-container">
          <!-- Three.js canvas mounts here -->
        </div>
        <div id="controls-mount" class="controls-mount">
          <!-- Left keybinds, right vertical history, and top controls overlay mount here -->
        </div>
      </section>

      <!-- Panel 2: Other Cubes (2x2, 4x4, Pyraminx) -->
      <section id="tab-other-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-other-btn" aria-hidden="true">
        <div id="other-mount" class="other-mount">
          <!-- Other Cubes Manager mounts here -->
        </div>
      </section>

      <!-- Panel 3: Learning Guide (3x3) -->
      <section id="tab-learn-panel" class="tab-panel" role="tabpanel" aria-labelledby="tab-learn-btn" aria-hidden="true">
        <div id="guide-mount" class="guide-mount">
          <!-- Learning Guide mounts here -->
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
